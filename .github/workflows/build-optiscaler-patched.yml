name: Build patched OptiScaler (DLSS-NR denoise first, display-res MV)

# Builds OptiScaler-DLSSNR-PreSR-Multipass at a pinned commit with the patches in
# OptiScaler-patches/ applied, runs their regression tests (headless + WARP) and uploads the
# resulting binaries. build-installer.yml calls it and ships the DLL in setup.exe / the zip;
# this workflow itself never publishes a release.
on:
  push:
    paths:
      - 'OptiScaler-patches/**'
      - '.github/workflows/build-optiscaler-patched.yml'
  workflow_dispatch:
  # Called by build-installer.yml so setup.exe and the standalone zip ship the patched DLL.
  workflow_call:
    outputs:
      base_tag:
        description: Upstream OptiScaler release tag the patches were built on
        value: ${{ jobs.build.outputs.base_tag }}
      artifact:
        description: Name of the uploaded artifact holding OptiScaler.dll
        value: ${{ jobs.build.outputs.artifact }}

permissions:
  contents: read

env:
  OPTISCALER_REPO: ShyVortex/OptiScaler-DLSSNR-PreSR-Multipass
  # The upstream release the patches were written against (the backend of DLSS Unlocked
  # NR-v0.9.50-hotfix); bump both together with the patches.
  OPTISCALER_TAG: v0.9.50
  OPTISCALER_REF: d5fa05cb92e9667b648d120e9d9b65e09bd2370a

jobs:
  build:
    runs-on: windows-latest
    outputs:
      base_tag: ${{ env.OPTISCALER_TAG }}
      artifact: OptiScaler-denoise-first-display-mv
    steps:
      # FidelityFX submodules have paths that exceed MAX_PATH under this repository's
      # long workspace directory; let Windows git create them.
      - name: Enable git long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          path: dlss-unlocked
          # When called from build-installer.yml, use the same commit as the caller.
          ref: ${{ github.sha }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.OPTISCALER_REPO }}
          ref: ${{ env.OPTISCALER_REF }}
          submodules: true
          path: optiscaler

      - name: Apply patches
        working-directory: optiscaler
        shell: pwsh
        run: |
          $patches = Get-ChildItem ../dlss-unlocked/OptiScaler-patches/*.patch | Sort-Object Name
          if (-not $patches) { throw 'No patches found' }
          foreach ($p in $patches) {
            Write-Host "Applying $($p.Name)"
            git apply --whitespace=nowarn $p.FullName
            if ($LASTEXITCODE -ne 0) { throw "Patch failed: $($p.Name)" }
          }
          git status --short

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Regression tests (display-resolution motion, NR guide metadata)
        working-directory: optiscaler
        shell: pwsh
        run: |
          ./tests/run_nr_denoise_first_display_motion.ps1
          $build = Join-Path $env:RUNNER_TEMP 'nr-guides'
          New-Item -ItemType Directory -Force -Path $build | Out-Null
          cl.exe /nologo /std:c++20 /EHsc /W4 "/Fo$build/" "/Fe$build/guides.exe" tests/nr_guides_smoke.cpp
          if ($LASTEXITCODE -ne 0) { throw 'nr_guides_smoke compilation failed' }
          & "$build/guides.exe"
          if ($LASTEXITCODE -ne 0) { throw 'nr_guides_smoke failed' }

      - uses: microsoft/setup-msbuild@v2

      - name: Build OptiScaler (Release x64)
        working-directory: optiscaler
        # Same invocation as upstream package_release.ps1 uses for its release DLL.
        run: msbuild OptiScaler.sln /m /p:Configuration=Release /p:Platform=x64 /p:PostBuildEventUseInBuild=false /verbosity:minimal

      - name: Collect binaries
        shell: pwsh
        run: |
          $src = 'optiscaler/x64/Release/a'
          if (-not (Test-Path "$src/OptiScaler.dll")) { throw "OptiScaler.dll not produced in $src" }
          $out = 'artifact'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$src/*" $out -Recurse -Force
          Copy-Item dlss-unlocked/OptiScaler-patches/README.md "$out/README-display-mv-patch.md"
          Get-FileHash "$out/OptiScaler.dll" -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-denoise-first-display-mv
          path: artifact
          if-no-files-found: error
